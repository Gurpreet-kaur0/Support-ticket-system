version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: helpdesk-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: helpdesk-server
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/support-tickets
      - JWT_SECRET=change-this-to-a-secure-secret-in-production
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: helpdesk-client
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  mongo_data:
