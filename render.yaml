services:
  - type: web
    name: helpdesk-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false # set this to your MongoDB Atlas connection string after creating the service

  - type: web
    name: helpdesk-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://helpdesk-server.onrender.com/api # update if Render gives your backend a different URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
